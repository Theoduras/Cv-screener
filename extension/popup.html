<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>CV Screener</title>
<script src="theme.js"></script>
<style>
  :root{color-scheme:light;--ink:#132322;--bg:#fff;--btn:#e2f3f1;--muted:#5a6e6c;--accent:#0f766e}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--ink:#e3efed;--bg:#13201f;--btn:#1b2e2c;--muted:#97b0ad;--accent:#138a80}}
  :root[data-theme="dark"]{color-scheme:dark;--ink:#e3efed;--bg:#13201f;--btn:#1b2e2c;--muted:#97b0ad;--accent:#138a80}
  body{font:14px system-ui,sans-serif;width:260px;margin:0;padding:14px;color:var(--ink);background:var(--bg)}
  h1{font-size:15px;margin:0 0 10px}
  button{display:block;width:100%;padding:10px;margin:6px 0;border:0;border-radius:8px;font:inherit;cursor:pointer;background:var(--btn);color:var(--ink)}
  button.primary{background:var(--accent);color:#fff}
  #msg{font-size:12px;color:var(--muted);min-height:1em;margin-top:6px}
</style></head>
<body>
  <h1>CV Screener</h1>
  <button class="primary" id="open">Open screener</button>
  <button id="capture">Capture candidate from this page</button>
  <button id="collect">Collect vacancies from this page</button>
  <div id="msg"></div>
  <script type="module" src="popup.js"></script>
</body></html>
